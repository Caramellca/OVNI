name: Download item images

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Скачать заново все картинки (иначе только недостающие)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FORCE: ${{ inputs.force && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev --no-save playwright

      - name: Install browser
        timeout-minutes: 15
        run: |
          for attempt in 1 2; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Попытка $attempt с системными пакетами не удалась"
            sleep 15
          done
          echo "Ставлю браузер без системных пакетов (apt недоступен)"
          npx playwright install chromium

      - name: Syntax check
        run: node --check scripts/fetch-images.mjs

      - name: Download images
        run: node scripts/fetch-images.mjs

      - name: Commit images
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "Новых картинок нет"
          else
            git commit -m "Добавить картинки предметов"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ github.run_id }}-${{ github.run_attempt }}
          path: fetch-output/
          retention-days: 14
          if-no-files-found: warn
